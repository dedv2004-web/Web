<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Partidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-p-4 md:p-8">

    <div id="app" class="max-w-2xl mx-auto space-y-6">
        <div class="min-h-screen bg-slate-100 flex items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuración por defecto de Firebase (puedes reemplazarla con la tuya)
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project" };
            
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let eventDetails = null;
        let players = [];
        let copySuccess = false;

        // Formulario inicial del evento
        let formData = {
            title: 'Partido 6*6',
            date: '',
            time: '23:00',
            location: 'Club Dominica Sport',
            maxPlayers: 14,
            quota: 3000
        };

        // Autenticación Anónima inicial
        auth.signInAnonymously().catch((error) => {
            console.error("Error en autenticación anónima:", error);
        });

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                initListeners();
            }
        });

        // Escuchar datos en tiempo real desde Firestore
        function initListeners() {
            // Escuchar detalles del evento
            db.collection('artifacts').doc(appId).collection('public').doc('data')
              .collection('eventDetails').doc('current')
              .onSnapshot((docSnap) => {
                if (docSnap.exists) {
                    eventDetails = docSnap.data();
                } else {
                    eventDetails = null;
                }
                renderApp();
            });

            // Escuchar jugadores inscritos
            db.collection('artifacts').doc(appId).collection('public').doc('data')
              .collection('players')
              .onSnapshot((snap) => {
                players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                players.sort((a, b) => a.createdAt - b.createdAt);
                renderApp();
            });
        }

        // Funciones de acciones
        window.handleInputChange = (field, value) => {
            formData[field] = value;
        };

        window.createEvent = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const newEvent = {
                title: document.getElementById('titleInput').value,
                date: document.getElementById('dateInput').value,
                time: document.getElementById('timeInput').value,
                location: document.getElementById('locationInput').value,
                maxPlayers: parseInt(document.getElementById('maxPlayersInput').value) || 14,
                quota: parseInt(document.getElementById('quotaInput').value) || 0,
                organizerId: currentUser.uid
            };

            await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('eventDetails').doc('current').set(newEvent);

            // Limpiar jugadores anteriores si se crea nuevo evento
            players.forEach(async (p) => {
                await db.collection('artifacts').doc(appId).collection('public').doc('data')
                        .collection('players').doc(p.id).delete();
            });
        };

        window.joinMatch = async (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('playerNameInput').value.trim();
            const errorDiv = document.getElementById('playerError');

            if (!inputVal) {
                errorDiv.innerText = 'Por favor, ingresa tu nombre.';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (players.length >= eventDetails.maxPlayers) {
                errorDiv.innerText = '¡El partido ya está lleno!';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (players.some(p => p.name.toLowerCase() === inputVal.toLowerCase())) {
                errorDiv.innerText = 'Ya hay un jugador con ese nombre.';
                errorDiv.classList.remove('hidden');
                return;
            }

            await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('players').add({
                        name: inputVal,
                        status: 'Pendiente',
                        createdAt: Date.now(),
                        userId: currentUser.uid
                    });
        };

        window.removePlayer = async (id) => {
            if (!currentUser) return;
            await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('players').doc(id).delete();
        };

        window.togglePayment = async (id, currentStatus) => {
            if (!currentUser) return;
            const newStatus = currentStatus === 'Pendiente' ? 'Confirmado' : 'Pendiente';
            await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('players').doc(id).update({ status: newStatus });
        };

        window.resetEvent = async () => {
            if (!currentUser) return;
            await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('eventDetails').doc('current').delete();
        };

        window.shareMatch = () => {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                copySuccess = true;
                renderApp();
                setTimeout(() => {
                    copySuccess = false;
                    renderApp();
                }, 3000);
            }).catch(() => {
                alert("Copia este enlace para compartir: " + url);
            });
        };

        // Renderizado visual de la aplicación
        function renderApp() {
            const appContainer = document.getElementById('app');

            if (!eventDetails) {
                // Vista de Creación de Evento
                appContainer.innerHTML = `
                    <div class="min-h-screen bg-green-50 text-slate-800 p-4 md:p-8 flex items-center justify-center">
                        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-green-100">
                            <div class="bg-gradient-to-r from-green-600 to-emerald-600 p-6 text-white text-center">
                                <i data-lucide="trophy" class="w-12 h-12 mx-auto mb-2 text-green-100"></i>
                                <h1 class="text-2xl font-bold">Crear Partido</h1>
                                <p class="text-green-100 text-sm mt-1">Organiza tu próximo encuentro</p>
                            </div>
                            
                            <form onsubmit="createEvent(event)" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Evento</label>
                                    <input type="text" id="titleInput" value="${formData.title}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
                                        <input type="date" id="dateInput" value="${formData.date}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Hora</label>
                                        <input type="time" id="timeInput" value="${formData.time}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Lugar / Cancha</label>
                                    <input type="text" id="locationInput" value="${formData.location}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Límite Jugadores</label>
                                        <input type="number" id="maxPlayersInput" value="${formData.maxPlayers}" min="2" max="30" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Cuota ($)</label>
                                        <input type="number" id="quotaInput" value="${formData.quota}" min="0" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                                    </div>
                                </div>
                                <button type="submit" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md flex justify-center items-center gap-2">
                                    Generar Evento <i data-lucide="arrow-left" class="h-5 w-5 rotate-180"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            } else {
                // Vista Pública de Partido e Inscripción
                const isFull = players.length >= eventDetails.maxPlayers;
                const progressPercentage = (players.length / eventDetails.maxPlayers) * 100;
                const isOrganizer = currentUser && eventDetails.organizerId === currentUser.uid;
                const totalCollected = players.filter(p => p.status === 'Confirmado').length * (eventDetails.quota || 0);

                appContainer.innerHTML = `
                    <div class="bg-gradient-to-r from-emerald-600 to-green-600 rounded-2xl shadow-md p-4 text-white flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="bg-white/25 p-2.5 rounded-xl"><i data-lucide="share-2" class="w-6 h-6"></i></div>
                            <div>
                                <h3 class="font-bold text-base">¡Comparte este partido!</h3>
                                <p class="text-emerald-100 text-xs">Envía el enlace a tus amigos para que se inscriban.</p>
                            </div>
                        </div>
                        <button onclick="shareMatch()" class="w-full sm:w-auto bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm flex items-center justify-center gap-2">
                            ${copySuccess ? '<i data-lucide="check" class="w-4 h-4 text-green-600"></i> ¡Enlace Copiado!' : '<i data-lucide="copy" class="w-4 h-4"></i> Copiar Enlace'}
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-md overflow-hidden relative border border-slate-200">
                        ${isOrganizer ? `
                            <div class="absolute top-4 right-4 z-10">
                                <button onclick="resetEvent()" class="text-white/90 hover:text-white text-xs bg-black/40 hover:bg-black/60 px-3 py-1.5 rounded-full backdrop-blur-md transition-all font-medium flex items-center gap-1">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i> Terminar Evento
                                </button>
                            </div>
                        ` : ''}
                        <div class="bg-gradient-to-r from-green-800 to-emerald-900 p-6 text-white h-40 flex flex-col justify-end">
                            <h1 class="text-3xl font-bold shadow-sm">${eventDetails.title}</h1>
                        </div>
                        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 bg-white">
                            <div class="flex items-center gap-3 text-slate-600">
                                <div class="bg-green-100 p-2 rounded-lg text-green-600"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                                <div><p class="text-sm font-medium text-slate-400">Fecha</p><p class="font-semibold text-slate-700">${eventDetails.date || 'Por definir'}</p></div>
                            </div>
                            <div class="flex items-center gap-3 text-slate-600">
                                <div class="bg-green-100 p-2 rounded-lg text-green-600"><i data-lucide="clock" class="w-5 h-5"></i></div>
                                <div><p class="text-sm font-medium text-slate-400">Hora</p><p class="font-semibold text-slate-700">${eventDetails.time} hrs</p></div>
                            </div>
                            <div class="flex items-center gap-3 text-slate-600 md:col-span-2">
                                <div class="bg-green-100 p-2 rounded-lg text-green-600"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                                <div><p class="text-sm font-medium text-slate-400">Lugar</p><p class="font-semibold text-slate-700">${eventDetails.location}</p></div>
                            </div>
                            <div class="flex items-center gap-3 text-slate-600 md:col-span-2 pt-4 border-t border-slate-100">
                                <div class="bg-emerald-100 p-2 rounded-lg text-emerald-600"><i data-lucide="banknote" class="w-5 h-5"></i></div>
                                <div class="flex-1 flex justify-between items-center">
                                    <div><p class="text-sm font-medium text-slate-400">Cuota</p><p class="font-bold text-emerald-600 text-lg">$${eventDetails.quota}</p></div>
                                    ${isOrganizer ? `<div class="text-right"><p class="text-xs font-medium text-slate-400">Recaudado</p><p class="font-bold text-slate-700">$${totalCollected}</p></div>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-1">
                            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
                                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="user-plus" class="w-5 h-5 text-green-600"></i> Unirse al Partido</h2>
                                <form onsubmit="joinMatch(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-sm text-slate-600 mb-1">Tu Nombre</label>
                                        <input type="text" id="playerNameInput" ${isFull ? 'disabled' : ''} placeholder="Ej. Juan Pérez" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none disabled:bg-slate-100" />
                                    </div>
                                    <div id="playerError" class="hidden text-red-500 text-sm bg-red-50 p-2 rounded-md"></div>
                                    <button type="submit" ${isFull ? 'disabled' : ''} class="w-full font-bold py-2.5 px-4 rounded-lg shadow-sm ${isFull ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 text-white'}">
                                        ${isFull ? 'Cupos Llenos' : 'Inscribirme'}
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div class="md:col-span-2">
                            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
                                <div class="flex justify-between items-end mb-4">
                                    <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-green-600"></i> Jugadores Inscritos</h2>
                                    <div class="text-right"><span class="text-2xl font-black text-green-600">${players.length}</span><span class="text-slate-400 font-medium text-sm"> / ${eventDetails.maxPlayers}</span></div>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-2.5 mb-6 overflow-hidden">
                                    <div class="h-2.5 rounded-full transition-all duration-500 ${isFull ? 'bg-red-500' : 'bg-green-500'}" style="width: ${Math.min(progressPercentage, 100)}%"></div>
                                </div>
                                ${players.length === 0 ? `
                                    <div class="text-center py-10 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                        <i data-lucide="trophy" class="w-10 h-10 mx-auto text-slate-300 mb-2"></i>
                                        <p>Aún no hay inscritos.</p><p class="text-sm">¡Sé el primero en unirte!</p>
                                    </div>
                                ` : `
                                    <ul class="space-y-2">
                                        ${players.map((player, index) => `
                                            <li class="flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl border ${player.status === 'Confirmado' ? 'bg-emerald-50/50 border-emerald-100' : 'bg-white border-slate-100'}">
                                                <div class="flex items-center gap-3 mb-2 sm:mb-0">
                                                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border ${player.status === 'Confirmado' ? 'bg-emerald-100 text-emerald-600 border-emerald-200' : 'bg-slate-100 text-slate-500 border-slate-200'}">${index + 1}</div>
                                                    <span class="font-semibold ${player.status === 'Confirmado' ? 'text-emerald-800' : 'text-slate-700'}">${player.name}</span>
                                                    <span class="text-[10px] uppercase font-bold px-2 py-1 rounded-full ${player.status === 'Confirmado' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}">${player.status}</span>
                                                </div>
                                                ${isOrganizer ? `
                                                    <div class="flex items-center gap-2">
                                                        <button onclick="togglePayment('${player.id}', '${player.status}')" class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold ${player.status === 'Confirmado' ? 'bg-slate-100 text-slate-600' : 'bg-emerald-500 text-white'}">
                                                            <i data-lucide="check" class="w-3 h-3"></i> ${player.status === 'Confirmado' ? 'Marcar Pendiente' : 'Confirmar'}
                                                        </button>
                                                        <button onclick="removePlayer('${player.id}')" class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                                    </div>
                                                ` : ''}
                                            </li>
                                        `).join('')}
                                    </ul>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            // Inicializar o refrescar los iconos de Lucide
            lucide.createIcons();
        }
    </script>
</body>
</html>
